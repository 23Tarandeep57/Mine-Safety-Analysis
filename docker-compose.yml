version: '3.8'

services:

  redis:
    image: redis:7-alpine
    container_name: msa-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: msa-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mine_safety
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msa-flask
    ports:
      - "5001:5001"
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./cause_code_db:/app/cause_code_db
    environment:
      - FLASK_ENV=production
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=mine_safety
      - MONGODB_COLLECTION=dgms_reports
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: python app.py
    restart: unless-stopped

  agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msa-agent
    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./cause_code_db:/app/cause_code_db
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=mine_safety
      - MONGODB_COLLECTION=dgms_reports
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.1-8b-instant}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    command: python agent.py
    restart: unless-stopped

  frontend:
    build:
      context: ./Front-end/MSA
      dockerfile: Dockerfile
    container_name: msa-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./Front-end/MSA/src:/app/src
      - ./Front-end/MSA/public:/app/public
    environment:
      - VITE_API_URL=http://localhost:5001/api
    depends_on:
      - flask
    restart: unless-stopped

volumes:
  redis_data:
  mongo_data:
